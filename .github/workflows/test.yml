---
#------------------------------------------------------------------------------
# Build the extension, and run its unit and integration tests, on every push
# and pull request.
#------------------------------------------------------------------------------
name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - alpha
      - beta
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package
        run: npx vsce package
