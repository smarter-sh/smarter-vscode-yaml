---
#------------------------------------------------------------------------------
# Build the extension, and run its unit and integration tests, on every push
# and pull request.
#------------------------------------------------------------------------------
name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - alpha
      - beta
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package
        run: npx vsce package
