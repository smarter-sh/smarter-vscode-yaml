###############################################################################
# This workflow is triggered manually to publish the extension
# to the Visual Studio Code Marketplace.
#
# https://marketplace.visualstudio.com/manage/publishers/Smarter
#
# To create a Personal Access Token (PAT) for publishing:
# 1. Go to https://dev.azure.com/lpm0073/Smarter
#    or https://dev.azure.com/lpm0073/_usersSettings/tokens
# 2. Add the token as a secret named "VSCE_PAT" in GitHub Secrets
###############################################################################

name: Publish Extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: npx vsce package

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish
